services:
  ssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: stowmark-ssh-test
    hostname: stowmark-ssh-test

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"

      USER_NAME: "stowmark"
      PUBLIC_KEY_FILE: "/keys/stowmark.pub"

      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"

    volumes:
      - ./ssh-test/config:/config
      - ./ssh-test/keys/stowmark.pub:/keys/stowmark.pub:ro
      - ./ssh-test/repositories:/repositories

    ports:
      - "127.0.0.1:2222:2222"

    restart: unless-stopped

  smb-server:
      image: ghcr.io/servercontainers/samba:smbd-only-latest
      hostname: stowmark-smb-test
      environment:
        ACCOUNT_stowmark: stowmark
        UID_stowmark: 1000

        AVAHI_DISABLE: "true"
        WSDD2_DISABLE: "true"
        NETBIOS_DISABLE: "true"

        SAMBA_VOLUME_CONFIG_stowmark: |
          [stowmark]
          path = /shares/stowmark
          valid users = stowmark
          read only = no
          browseable = yes
          guest ok = no
          create mask = 0644
          directory mask = 0755

      ports:
        - "1445:445"

      tmpfs:
        - /shares/stowmark:mode=0777

      restart: unless-stopped