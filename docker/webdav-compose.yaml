name: stowmark-webdav

services:
  webdav-server:
    image: ghcr.io/hacdias/webdav:v5.17.3
    user: "1000:1000"
    command:
      - --config
      - /config.yml
    ports:
      - "18080:8080"
    volumes:
      - ./webdav-test/config.yml:/config.yml:ro
      - ./webdav-data:/data
    restart: unless-stopped

volumes:
  webdav-data: