version: '3'

vars:
  COMPOSE_FILE: docker/smb-compose.yaml
  SMB_SERVICE: smb-server

tasks:
  up:
    desc: Start only the SMB server
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" up -d "{{.SMB_SERVICE}}" --remove-orphans

  down:
    desc: Stop and remove only the SMB server
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" rm -s -f "{{.SMB_SERVICE}}"

  stop:
    desc: Stop the SMB server without removing it
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" stop "{{.SMB_SERVICE}}"

  logs:
    desc: Show the SMB server logs
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" logs -f "{{.SMB_SERVICE}}"

  restart:
    desc: Restart the SMB server
    deps:
      - keys
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" restart "{{.SMB_SERVICE}}"