version: "3"

vars:
  COMPOSE_FILE: docker/webdav-compose.yaml
  WEBDAV_SERVICE: webdav-server
  WEBDAV_URL: http://localhost:18080
  WEBDAV_USERNAME: stowmark
  WEBDAV_PASSWORD: stowmark

tasks:
  up:
    desc: Start the WebDAV test server
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" up -d "{{.WEBDAV_SERVICE}}"

  down:
    desc: Stop the WebDAV test server
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" stop "{{.WEBDAV_SERVICE}}"

  restart:
    desc: Restart the WebDAV test server
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" restart "{{.WEBDAV_SERVICE}}"

  logs:
    desc: Show the WebDAV test server logs
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" logs -f "{{.WEBDAV_SERVICE}}"

  status:
    desc: Show the WebDAV test server status
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" ps "{{.WEBDAV_SERVICE}}"

  test:
    desc: Check the WebDAV test server connection
    cmds:
      - |
        curl \
          --fail \
          --silent \
          --show-error \
          --user "{{.WEBDAV_USERNAME}}:{{.WEBDAV_PASSWORD}}" \
          --request PROPFIND \
          --header "Depth: 0" \
          "{{.WEBDAV_URL}}/"