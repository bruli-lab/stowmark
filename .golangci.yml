version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - revive
    - gocritic
    - bodyclose
    - misspell
    - unconvert
    - dupl
    - depguard
    - errorlint
    - testifylint
    - contextcheck
    - noctx

  settings:
    dupl:
      threshold: 80
    errcheck:
      check-type-assertions: true
      check-blank: false

    revive:
      rules:
        - name: unused-parameter
          disabled: false

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style

    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/bruli-lab/stowmark/internal/app
              desc: the domain must not depend on the application layer
            - pkg: github.com/bruli-lab/stowmark/internal/infra
              desc: the domain must not depend on infrastructure
            - pkg: github.com/bruli-lab/stowmark/internal/config
              desc: the domain must not read configuration
            - pkg: github.com/bruli-lab/stowmark/pkg
              desc: the domain must not depend on the public API
        app:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/bruli-lab/stowmark/internal/infra
              desc: the application layer must depend on ports, not on infrastructure
            - pkg: github.com/bruli-lab/stowmark/internal/config
              desc: the application layer must not read configuration
            - pkg: github.com/bruli-lab/stowmark/pkg
              desc: the application layer must not depend on the public API

  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - dupl
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
