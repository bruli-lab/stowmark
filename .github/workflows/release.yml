name: Check and release

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Lint
        run: task lint

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Security
        run: task security

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Unit tests
        run: task unit-test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Integration tests
        run: task integration-test

  trivy-filesystem:
    name: Scan source and dependencies
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.69.3"
        run: |
          set -euo pipefail

          curl -fsSLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

          trivy --version

      - name: Scan repository
        run: |
          set -euo pipefail

          trivy filesystem \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

      - name: Generate SARIF report
        if: always()
        run: |
          set -euo pipefail

          trivy filesystem \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload results to GitHub Security
        if: >-
          ${{
            always() &&
            hashFiles('trivy-results.sarif') != '' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

  release:
    name: Semantic release
    needs:
      - lint
      - security
      - unit-tests
      - integration-tests
      - trivy-filesystem

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 25.0.8
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    name: Windows installer
    needs:
      - release

    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          go build -o dist\windows\stowmark.exe ./cmd/cli

      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $compiler = (Get-Command iscc.exe).Source
          & $compiler `
            "/DAppVersion=$env:APP_VERSION" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\dist\windows\stowmark.exe" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist\windows" `
            packaging\windows\stowmark.iss

      - name: Upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $installer = "dist\windows\stowmark_$($env:APP_VERSION)_windows_amd64_setup.exe"
          $checksum = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $filename = Split-Path -Leaf $installer
          "$checksum  $filename" | Set-Content -NoNewline "$installer.sha256"

          gh release upload `
            "v$env:APP_VERSION" `
            $installer `
            "$installer.sha256" `
            --clobber
