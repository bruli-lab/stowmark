name: Setup Go and Task

description: Setup Go from go.mod, cache modules and install Task

inputs:
  task-version:
    description: Task version to install
    required: false
    default: 'v3.54.0' # renovate: task

runs:
  using: composite
  steps:
    - name: Set up Go from go.mod
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install Task
      shell: bash
      env:
        TASK_VERSION: ${{ inputs.task-version }}
      run: |
        go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
        echo "$HOME/go/bin" >> "$GITHUB_PATH"
