name: Setup Go and Task

description: Setup Go from go.mod, cache modules and install Task

inputs:
  task-version:
    description: Task version to install
    required: false
    default: 'v3.54.0' # renovate: task

runs:
  using: composite
  steps:
    - name: Set up Go from go.mod
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install Task
      shell: bash
      env:
        TASK_VERSION: ${{ inputs.task-version }}
      run: |
        go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
        echo "$HOME/go/bin" >> "$GITHUB_PATH"
